[program:ctfile-downloader]
command=/app/scripts/start-ctfile-downloader.sh
directory=/app/ctfile-downloader-node
autostart=true
autorestart=true
stderr_logfile=/var/log/ctfile-downloader.err.log
stdout_logfile=/var/log/ctfile-downloader.out.log
user=root
; 不在 environment 中引用 %(ENV_TOKENS)s：
; go-supervisord 在环境变量不存在时会跳过整个 program。
; 子进程会自动继承容器的 SESSIONS / TOKENS / PASSWORD 等环境变量。

