[program:ctfile-downloader-panel]
command=/app/scripts/start-panel.sh
directory=/app/ctfile-downloader-panel
autostart=true
autorestart=true
stderr_logfile=/var/log/ctfile-downloader-panel.err.log
stdout_logfile=/var/log/ctfile-downloader-panel.out.log
user=root
; NEXT_PUBLIC_API_URL 由 Dockerfile ENV 或 docker run -e 提供，子进程自动继承。

